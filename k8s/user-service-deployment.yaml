apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: bookstore

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:

        - name: user-service

          image: bala0804/bookstore-user-service:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8002

          env:

            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mongodb-url

            - name: DATABASE_NAME
              value: "bookstore"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key

            - name: JWT_ALGORITHM
              value: "HS256"

            - name: ADMIN_USERNAME
              value: "admin"

            - name: ADMIN_EMAIL
              value: "admin@bookstore.com"

            - name: ADMIN_PASSWORD
              value: "admin123"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "200m"

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002

            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002

            initialDelaySeconds: 10
            periodSeconds: 5

---

apiVersion: v1
kind: Service

metadata:
  name: user-service
  namespace: bookstore

spec:
  selector:
    app: user-service

  ports:
    - port: 8002
      targetPort: 8002

  type: ClusterIP