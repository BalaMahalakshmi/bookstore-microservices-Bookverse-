apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: bookstore
spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: bala0804/bookstore-order-service:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8003

          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mongodb-url

            - name: DATABASE_NAME
              value: "bookstore"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key

            - name: JWT_ALGORITHM
              value: "HS256"

            - name: BOOK_SERVICE_URL
              value: "http://book-service:8001"

            - name: INTERNAL_SERVICE_TOKEN
              value: "bookstore-internal-secret"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: bookstore
spec:
  selector:
    app: order-service

  ports:
    - port: 8003
      targetPort: 8003

  type: ClusterIP